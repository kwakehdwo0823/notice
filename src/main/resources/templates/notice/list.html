<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
</head>
<body>
<h1>공지사항 목록</h1>

<!-- 글쓰기 버튼 -->
<a href="/notice/write">글쓰기</a>

<table border="1">
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
    </tr>
    </thead>
    <tbody>
    <!-- 자바가 보낸 noticeList 바구니를 뱅글뱅글 돌면서(loop) 하나씩 꺼내기 -->
    <tr th:each="notice : ${noticeList}">
        <td th:text="${notice.id}">1</td>
        <!-- 제목을 누르면 상세 페이지(/notice/detail/번호)로 이동 -->
        <td>
            <a th:href="@{/notice/detail/{id}(id=${notice.id})}" th:text="${notice.title}">제목입니다</a>
        </td>
    </tr>
    </tbody>
</table> <!-- 👈 여기에 </table> 닫는 태그를 꼭 넣어주어야 합니다! -->
</body>
</html>
